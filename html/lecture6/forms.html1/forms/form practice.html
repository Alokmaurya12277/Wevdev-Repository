        <h2 class="click">Online Order Form</h2>
        <p class="click">reuired fields</p><br>
        <fieldset class="root">
            <legend><em>Details</em></legend>
            <form action="">
                <label for="nam">*Name:</label>
                <input type="text" id="nam" placeholder="Enter you name"><br><br>
                <label for="add">*Address:</label>
                <input type="text" id="add" placeholder="Enter you address"><br><br>
                <label for="city">*City:</label>
                <input type="text" id="city" placeholder="Enter you city"><br><br>
                <label for="pho">*Phone:</label>
                <input type="number" id="pho" placeholder="Enter you number"><br><br>
                <label for="pin">*Pincode:</label>
                <input type="number" id="pin" placeholder="Enter you pincode"><br><br>
        </fieldset><br><br>
        <fieldset class="all">
            <form action="">
                <h3 class="center">Please choose type a Pizza</h3>
                <fieldset class="three">
                    <legend><em>*Topping</em></legend>
                    <span class="pizza">
                        <input type="radio" id="mar">
                        <label for="mar">Margherita</label><br>
                        <input type="radio" id="four">
                        <label for="four">Four Seasons</label><br>
                        <input type="radio" id="meat">
                        <label for="meat">Meat Feast</label><br>
                    </span>
                </fieldset>
                <fieldset class="size">
                    <legend><em>*Size</em></legend>
                    <span class="pizza">
                        <input type="radio" id="sma" name="sizes">
                        <label for="sma">Small</label><br>
                        <input type="radio" id="med" name="sizes">
                        <label for="med">Medium</label><br>
                        <input type="radio" id="lar" name="sizes">
                        <label for="lar">Larg</label><br>
                    </span>
                </fieldset>
                <fieldset class="extra">
                    <legend><em>*Extra</em></legend>
                    <span class="pizza">
                        <input type="checkbox" id="mus">
                        <label for="mus">Mushrooms</label><br>
                        <input type="checkbox" id="gre">
                        <label for="gre">Green peppers</label><br>
                        <input type="checkbox" id="anc">
                        <label for="anc">Anchorvies</label><br>
                        <input type="checkbox" id="ext">
                        <label for="ext">Extra cheese</label><br>
                    </span>
                </fieldset><br><br>
                <button id="button" type="button">Save Order</button><br>
                <button id="can" type="button">Cancel</button>
            </form>
        </fieldset>
        </form>
