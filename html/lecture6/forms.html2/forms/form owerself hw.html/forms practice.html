<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    label{
        display: inline-block;
        width: 100px;
    }
    </style>
</head>
<body>
    <h2 style="text-align: center; color: blue;"><u>Student Registration Form Using Table in HTML</u></h2>
    <div  style="background-color: violet;" >
        <fieldset style="border: 1px dotted; color: black;"><br>
        <form action=""  >
            <label for="fis">Fist name:</label>
            <input type="text" id="fis" placeholder="enter first name" required>
            <br><br>
             <label for="las">Last name:</label>
            <input type="text" id="las" placeholder="enter last name" required >
            <br><br>
             <label for="ema">Email Id:</label>
            <input type="email" id="ema" placeholder="enter your email" required>
            <br><br>
             <label for="mob">Mobile number:</label>
            <input type="number" placeholder="enter your mobile " required >
            <br><br>
             <label for="">Gender:</label>
             <label for="mal"></label>
            <input type="radio" id="mal" name="Gender" required>Male
            <label for="fem"></label>
            <input type="radio" id="fem" name="Gender">Female <br><br>
            <br><br>
             <label for="dat">Date of birth(DOB):</label>
            <input type="date" id="dat" required >
            <br><br>
            <label for="">Address:</label>
            <input type="text" placeholder="enter your adderess " required ><br><br>
            <label for="city">City</label>
            <select name="" id="city" required >
                <option value="">Enter your city</option>
                <option value="">Mau</option>
                <option value="">Ballia</option>
                <option value="">Azamgarh</option>
            </select><br><br>
            <br><br>
             <label for="pin">Pin Code:</label>
            <input type="number" id="pin" min="0" max="999999" placeholder="enter pincode" required><br><br>
            <label for="sta">States:</label>
            <select name="" id="sta" required >
                <option value="">Enter your stare</option>
                <option value="">Uttar Pradesh</option>
                <option value="">Delhi</option>
                <option value="">Rajsthan</option>
            </select><br><br>
            <label for="">Country:</label>
            <select name="" id="" required >
                <option value="">Enter your state</option>
                <option value="">India</option>
                <option value="">Pakistan</option>
                <option value="">China</option>
            </select><br><br>
            <label for=""  >Hobbies:</label>
            <input type="checkbox" > Singing
            <input type="checkbox"> Dancing
            <input type="checkbox"> Reading
            <input type="checkbox"> Drawing <br><br>
            <label for=""></label>
            <input type="checkbox" required> High School<br>
            <label for=""></label>
            <input type="checkbox"> Entermidiate<br>
            <label for="">Qualification:</label>
            <input type="checkbox"> Graduation<br>
            <label for=""></label>
            <input type="checkbox"> Post Graduation<br>
            <label for=""></label>
            <input type="checkbox">Phd<br><br>
            <label for="ba"></label>
            <input type="radio" id="ba" name="cour" > B.A<br>
            <label for="edu"></label>
            <input type="radio" id="edu" name="cour" >B.Sc<br>
            <label for="">Apply course:</label>
            <input type="radio" name="cour" >B.COM<br>
            <label for="bc"></label>
            <input type="radio" id="bc" name="cour" >B.C.A <br>
            <label for="agr"></label>
            <input type="radio" id="agr" name="cour" >AGICULTURE<br><br><br>
            <label for="agr"></label>
            <input style="color: blue;" type="submit" >
            <label for=""></label>
            <input style="color: red;" type="reset">


        </form>
        </fieldset>
    </div>
    
</body>
</html>
